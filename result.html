
<html>
<body>
    <h2>Student Results</h2>

    Name: <input type="text"><br><br>
    Marks: <input type="number" id="m"><br><br>

    <button onclick="check()">Check Result</button>
    <p id="r"></p>

    <script>
        function check() {
            let m = document.getElementById("m").value;

            if (m == "")
                document.getElementById("r").innerHTML = "Enter marks";
            else if (m >= 35)
                document.getElementById("r").innerHTML = "Pass";
            else
                document.getElementById("r").innerHTML = "Fail";
        }
    </script>
</body>
</html>
